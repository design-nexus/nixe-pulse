[package]
name = "nyx-pulse"
version = "0.1.0"
description = "Native Telegram desktop client for Omarchy Linux and the Nyx Suite"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-pulse"
path = "src/main.rs"

[dependencies]
nyx-playback = { git = "https://github.com/design-nexus/nyx-design.git", rev = "938c638951a53f5874a8276d07ac9dcd68b191ad" }
flate2 = "1"
base64 = "0.22"
libloading = "0.8"
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "52cba5e27a3dd5f00c780f53e423302b4b5f9c9c" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "938c638951a53f5874a8276d07ac9dcd68b191ad" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "938c638951a53f5874a8276d07ac9dcd68b191ad" }
nyx-telegram-core = { path = "../../crates/nyx-telegram-core" }
nyx-telegram-calls = { path = "../../crates/nyx-telegram-calls" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-channel = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
