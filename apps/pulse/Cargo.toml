[package]
name = "nixe-pulse"
version = "0.1.0"
description = "Native Telegram desktop client for Omarchy Linux and the Nixe Suite"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nixe-pulse"
path = "src/main.rs"

[dependencies]
nixe-playback = { path = "../../crates/nixe-playback" }
flate2 = "1"
base64 = "0.22"
libloading = "0.8"
nixe-core = { path = "../../crates/nixe-core" }
nixe-theme = { path = "../../crates/nixe-theme" }
nixe-ui = { path = "../../crates/nixe-ui" }
nixe-telegram-core = { path = "../../crates/nixe-telegram-core" }
nixe-telegram-calls = { path = "../../crates/nixe-telegram-calls" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-channel = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
