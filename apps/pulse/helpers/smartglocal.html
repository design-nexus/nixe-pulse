<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Secure card tokenization</title><style>body{font:16px system-ui;max-width:420px;margin:40px auto;padding:20px}label,input,button{display:block;margin:12px 0;width:100%;box-sizing:border-box}input,button{padding:12px}</style><h1>Payment details</h1><p>The provider receives card details to create a token. Review the final charge in Pulse.</p><form><label>Card number<input id="number" autocomplete="cc-number" inputmode="numeric" required></label><label>Expiry month<input id="month" autocomplete="cc-exp-month" inputmode="numeric" maxlength="2" required></label><label>Expiry year<input id="year" autocomplete="cc-exp-year" inputmode="numeric" maxlength="4" required></label><label>Security code<input id="code" type="password" autocomplete="cc-csc" inputmode="numeric" maxlength="4" required></label><button>Tokenize card</button></form><p id="status" role="status"></p><script>
const endpoint=__ENDPOINT__,token=__TOKEN__;document.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const digits=id=>document.getElementById(id).value.replace(/\D/g,'');const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','X-PUBLIC-TOKEN':token},body:JSON.stringify({card:{number:digits('number'),expiration_month:digits('month').padStart(2,'0'),expiration_year:digits('year').slice(-2),security_code:digits('code')}})});const data=await response.json();if(!response.ok||!data.data?.token)throw Error('The provider could not tokenize this card. Check the details and try again.');document.getElementById('number').value='';document.getElementById('code').value='';TelegramWebviewProxy.postEvent('payment_form_submit',JSON.stringify({credentials:{type:'card',token:data.data.token}}));}catch(err){document.getElementById('status').textContent=err.message;b.disabled=false;}};
</script>
