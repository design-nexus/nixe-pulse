<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://js.stripe.com/v3/"></script><style>body{font:16px sans-serif;margin:24px;background:#fff;color:#222}input,button,#card{box-sizing:border-box;padding:14px;margin:12px 0;width:100%;border:1px solid #ccc;border-radius:6px}button{background:#287bc1;color:white}#error{color:#b21e35}</style></head><body><h2>Payment method</h2><p>Card details go directly to Stripe. Pulse receives a payment token. You will review the charge in Pulse before paying.</p><label>Cardholder name<input id="name" autocomplete="cc-name"></label><label>Country code<input id="country" maxlength="2" autocomplete="country"></label><label>Postal code<input id="postal" autocomplete="postal-code"></label><div id="card"></div><div id="error" role="alert"></div><button id="save">Use this payment method</button><script>
const stripe=Stripe(__PUBLIC_KEY__); const card=stripe.elements().create('card');card.mount('#card');
document.querySelector('#save').onclick=async()=>{let b=document.querySelector('#save');b.disabled=true;let result=await stripe.createToken(card,{name:document.querySelector('#name').value,address_country:document.querySelector('#country').value,address_zip:document.querySelector('#postal').value});if(result.error){document.querySelector('#error').textContent=result.error.message;b.disabled=false;return}TelegramWebviewProxy.postEvent('payment_form_submit',JSON.stringify({credentials:JSON.stringify({type:'card',id:result.token.id})}));};
</script></body></html>
