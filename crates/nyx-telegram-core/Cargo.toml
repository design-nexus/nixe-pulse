[package]
name = "nyx-telegram-core"
version = "0.1.0"
description = "TDLib protocol engine, authentication, and chat synchronization for Nyx Pulse"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
async-channel = "2"
parking_lot = "0.12"
libloading = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
