[package]
name = "nyx-telegram-calls"
version = "0.1.0"
description = "Calling media subsystem (WebRTC, PipeWire, tgcalls) for Nyx Pulse"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros"] }
tracing = "0.1"
sha2 = "0.10"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
async-channel = "2"
base64 = "0.22"
libc = "0.2"
libloading = "0.8"

[build-dependencies]
bindgen = "0.72"
